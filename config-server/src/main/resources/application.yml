server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - "file:../config-repo"
            - "file:./config-repo"
            - "file:./config-server/src/main/resources/config"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
