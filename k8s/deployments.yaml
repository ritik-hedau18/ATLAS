      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: atlas/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
