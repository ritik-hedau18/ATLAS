name: ATLAS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests
        run: mvn clean install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Microservice Images
        run: |
          services=("discovery-server" "config-server" "api-gateway" "user-service" "post-service" "connection-service" "feed-service" "job-service" "notification-service" "search-service" "ai-service" "audit-log-service")
          for service in "${services[@]}"; do
            echo "Building and pushing image for $service..."
            docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/atlas-$service:latest ./$service
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/atlas-$service:latest
          done

      - name: Deploy to Kubernetes via Helm
        uses: azure/k8s-set-context@v1
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Helm Upgrade / Install
        run: |
          helm upgrade --install atlas ./helm --values ./helm/values.yaml

      - name: Run Smoke Tests
        run: |
          echo "Verifying API Gateway health..."
          curl -f http://api-gateway/actuator/health || exit 1
