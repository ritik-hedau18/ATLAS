apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.db.postgresPassword | b64enc }}
  NEO4J_PASSWORD: {{ .Values.db.neo4jPassword | b64enc }}
  JWT_SECRET: {{ .Values.jwt.secret | b64enc }}
  HUGGINGFACE_API_TOKEN: {{ .Values.huggingface.token | b64enc }}
